      --primary: #5eb5f7;
      --primary-hover: #4aa3e6;
      --text: #ffffff;
      --text-muted: #8b9aad;
      --border: rgba(255, 255, 255, 0.06);

    html, body {

      line-height: 1.5;

    .card {

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--primary), #7cc5f9);

      justify-content: center;

      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 14px;
      transition: background 0.15s ease, transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .download-button:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }
    .download-button:active {
      transform: translateY(0);
    }
    .meta {
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;

      justify-content: center;

    .divider {

      text-decoration: none;
      color: var(--text);
      transition: background 0.15s ease;
    }
    .version:hover {
      background: #232e3c;
    }
    .version-name {
      font-size: 14px;
      font-weight: 500;
    }
    .version-date {
      font-size: 12px;
      color: var(--text-muted);
    }
    .back-link {
      display: inline-block;
      margin-top: 32px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
